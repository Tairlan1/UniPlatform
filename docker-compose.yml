services:
  web:
    build:
      context: .
      args:
        # При боевом развёртывании укажите реальный адрес сервера Shyn,
        # например: VITE_SHYN_API_BASE=https://shyn.damqor.edu
        VITE_SHYN_API_BASE: ${VITE_SHYN_API_BASE:-http://127.0.0.1:5001}
    ports:
      - "8080:80"
    restart: unless-stopped
